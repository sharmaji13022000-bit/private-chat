<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Private Chat</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background-color: #0b141a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #login-box, #chat-box { width: 90%; max-width: 400px; background: #111b21; border-radius: 10px; overflow: hidden; }
    #login-box { padding: 25px; display: flex; flex-direction: column; gap: 15px; }
    #chat-box { display: none; height: 80vh; flex-direction: column; }
    input, button { padding: 12px; border-radius: 6px; border: none; font-size: 14px; }
    input { background: #2a3942; color: #fff; outline: none; }
    button { background: #00a884; color: #fff; font-weight: bold; cursor: pointer; }
    #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    .sent { background: #005c4b; align-self: flex-end; }
    .received { background: #202c33; align-self: flex-start; }
    .system { align-self: center; font-size: 12px; color: #8696a0; }
    #chat-input-area { display: flex; padding: 10px; background: #202c33; gap: 8px; }
    #msg-input { flex: 1; }
  </style>
</head>
<body>

  <div id="login-box">
    <h2 style="text-align: center;">Private Room</h2>
    <input type="text" id="username" placeholder="Apna Naam dalein">
    <input type="text" id="room" placeholder="Koi bhi Room Code (e.g. 1234)">
    <button onclick="joinChat()">Chat Shuru Karein</button>
  </div>

  <div id="chat-box">
    <div style="padding: 12px; background: #202c33; font-weight: bold;" id="chat-header">Chat</div>
    <div id="messages"></div>
    <form id="chat-input-area" onsubmit="sendMessage(event)">
      <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUsername = "";

    function joinChat() {
      const username = document.getElementById('username').value.trim();
      const roomId = document.getElementById('room').value.trim();

      if (!username || !roomId) return alert("Dono cheezein bharna zaroori hai!");

      currentUsername = username;
      socket.emit('join-room', { username, roomId });

      document.getElementById('login-box').style.display = 'none';
      document.getElementById('chat-box').style.display = 'flex';
      document.getElementById('chat-header').innerText = `Room Code: ${roomId}`;
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send-message', { text });
      input.value = '';
    }

    socket.on('receive-message', (data) => {
      const container = document.getElementById('messages');
      const el = document.createElement('div');
      const isMe = data.sender === currentUsername;
      
      el.className = `msg ${isMe ? 'sent' : 'received'}`;
      el.innerHTML = `<strong>${isMe ? 'You' : data.sender}:</strong> ${data.text}`;
      
      container.appendChild(el);
      container.scrollTop = container.scrollHeight;
    });

    socket.on('system-message', (msg) => {
      const container = document.getElementById('messages');
      const el = document.createElement('div');
      el.className = 'system';
      el.innerText = msg;
      container.appendChild(el);
      container.scrollTop = container.scrollHeight;
    });

    socket.on('room-full', (msg) => {
      alert(msg);
      window.location.reload();
    });
  </script>
</body>
</html>
